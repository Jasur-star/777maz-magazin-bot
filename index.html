<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>777MAZ Market</title>
<style>
*{box-sizing:border-box}
:root{font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#fff;color:#111}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:auto;padding:18px 16px 90px}
h1{font-size:32px;margin:0 0 5px;font-weight:800}
.sub{color:#777;font-size:18px;margin-bottom:20px}
.search{width:100%;border:0;background:#f4f4f4;border-radius:18px;padding:16px 20px;font-size:18px;outline:none}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 0 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:18px;padding:9px 14px}
.cat.active{background:#111;color:#fff;border-color:#111}
h2{font-size:25px;margin:20px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid #eee;border-radius:20px;padding:12px;background:#fff;box-shadow:0 2px 10px #eee}
.pic{height:170px;background:#f5f5f5;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:68px}
.pic img{width:100%;height:100%;object-fit:cover}
.name{font-size:19px;font-weight:700;margin-top:12px}
.price{font-size:18px;font-weight:800;margin-top:7px}
.old{text-decoration:line-through;color:#999;font-size:14px;margin-top:5px}
.badge{font-size:12px;margin-top:6px;color:#555}
.add{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:11px;margin-top:10px;font-weight:700}
.cartbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(700px,calc(100% - 28px));background:#111;color:#fff;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;z-index:30}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:50}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:22px 18px 24px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 18px;font-size:29px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.rowinfo{flex:1}
.rowname{font-size:18px}
.rowprice{font-weight:800;margin-top:5px}
.q{display:flex;align-items:center;gap:7px}
.q button{width:38px;height:38px;border:1px solid #999;background:#fff;border-radius:5px}
.total{font-size:23px;font-weight:800;margin:22px 0}
label{display:block;font-size:17px;font-weight:700;margin:13px 0 7px}
input,textarea,select{width:100%;border:1px solid #ddd;border-radius:16px;padding:15px 16px;background:#f9f9f9;outline:none}
input:focus,textarea:focus,select:focus{border-color:#111}
textarea{min-height:92px;resize:vertical}
.primary{width:100%;border:0;background:#111;color:#fff;border-radius:16px;padding:15px;font-weight:800;margin-top:10px}
.secondary{width:100%;border:1px solid #ddd;background:#fff;border-radius:16px;padding:14px;margin-top:9px}
.locstatus{background:#edf5ff;border-radius:14px;padding:13px;margin:8px 0;color:#222}
.locbtn{width:100%;border:0;background:#111;color:#fff;border-radius:16px;padding:15px;font-weight:800}
.map{display:none;margin:8px 0;color:#0759a5;text-decoration:none}
.notice{background:#f5f5f5;border-radius:14px;padding:12px;font-size:14px;color:#555;margin:8px 0}
.empty{text-align:center;padding:35px;color:#777}
@media(max-width:480px){.wrap{padding:16px 14px 85px}h1{font-size:29px}.pic{height:150px}.card{padding:10px}.name{font-size:17px}.price{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>777MAZ Market</h1>
  <div class="sub">Sifatli mahsulotlar — qulay xarid</div>

  <input id="search" class="search" placeholder="🔎 Mahsulot izlash..." oninput="render()">

  <div id="cats" class="cats"></div>

  <h2>Mahsulotlar</h2>
  <div id="products" class="grid"></div>
</div>

<button class="cartbar" onclick="openCart()">🛒 Savat (<span id="count">0</span>)</button>

<div id="cartModal" class="modal">
 <div class="sheet">
  <h2>🛒 Savat va buyurtma</h2>
  <div id="cartList"></div>
  <div id="cartTotal" class="total"></div>
  <button class="primary" onclick="openCheckout()">📝 Buyurtma berish</button>
  <button class="secondary" onclick="closeModal('cartModal')">Yopish</button>
 </div>
</div>

<div id="checkoutModal" class="modal">
 <div class="sheet">
  <h2>📦 Yetkazib berish</h2>

  <input id="name" placeholder="Xolmatov Jasur">
  <input id="phone" placeholder="20 000 08 35" type="tel">
  <textarea id="address" placeholder="Ko‘cha, uy, xonadon"></textarea>

  <div id="locStatus" class="locstatus">📍 Lokatsiya olinmagan</div>
  <button id="locBtn" class="locbtn" onclick="getLocation()">📍 Lokatsiyamni aniqlash</button>
  <a id="map" class="map" target="_blank">🗺 Lokatsiyani xaritada ko‘rish</a>

  <label>💵 To‘lov usuli</label>
  <select id="payment">
    <option value="Naqd pul">💵 Naqd pul</option>
    <option value="Karta orqali">💳 Karta orqali</option>
    <option value="Joyida to‘lov">🏪 Joyida to‘lov</option>
  </select>

  <div id="checkoutTotal" class="total"></div>
  <button id="sendBtn" class="primary" onclick="sendOrder()">✅ Buyurtmani tasdiqlash</button>
  <button class="secondary" onclick="closeModal('checkoutModal')">Yopish</button>
 </div>
</div>

<div id="doneModal" class="modal">
 <div class="sheet" style="text-align:center">
  <div style="font-size:60px">✅</div>
  <h2>Buyurtma qabul qilindi</h2>
  <p>Buyurtmangiz admin Telegram'iga yuborildi.</p>
  <button class="primary" onclick="finish()">🏠 Marketga qaytish</button>
 </div>
</div>

<script>
let products=[];
let cart={};
let activeCat='';
let lat=null,lon=null;

const fallbackIcons={
 '🥤 Ichimliklar':'🥤','🍫 Shirinliklar':'🍫','🍎 Mevalar':'🍎',
 '🥕 Sabzavotlar':'🥕','👶 Bolalar ovqati':'👶',
 '🍳 Oshxona mahsulotlari':'🍳','🧴 Gellar va shampunlar':'🧴'
};

function esc(x){
 return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function money(x){return Number(x||0).toLocaleString('uz-UZ')+" so‘m"}

async function loadProducts(){
 try{
   const r=await fetch('/api/products',{cache:'no-store'});
   if(!r.ok) throw new Error('API');
   const d=await r.json();
   products=d.products||[];
   buildCats();
   render();
 }catch(e){
   document.getElementById('products').innerHTML='<div class="empty">❌ Mahsulotlarni yuklab bo‘lmadi.</div>';
 }
}

function buildCats(){
 const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];
 document.getElementById('cats').innerHTML=
   `<button class="cat ${activeCat===''?'active':''}" onclick="setCat('')">Barchasi</button>`+
   cats.map(c=>`<button class="cat ${activeCat===c?'active':''}" onclick="setCat(${JSON.stringify(c)})">${esc(c)}</button>`).join('');
}
function setCat(c){activeCat=c;buildCats();render()}

function render(){
 const q=(document.getElementById('search').value||'').toLowerCase().trim();
 const list=products.filter(p=>
   (!activeCat||p.category===activeCat)&&
   (!q||String(p.name||'').toLowerCase().includes(q))
 );
 const el=document.getElementById('products');
 if(!list.length){el.innerHTML='<div class="empty">Mahsulot topilmadi.</div>';updateCount();return}
 el.innerHTML=list.map(p=>{
   const img=p.image_file_id
     ? `<img src="/api/product-image?file_id=${encodeURIComponent(p.image_file_id)}" alt="${esc(p.name)}" onerror="this.remove();this.parentElement.insertAdjacentText('beforeend','${fallbackIcons[p.category]||'🛍️'}')">`
     : (fallbackIcons[p.category]||'🛍️');
   return `<div class="card">
     <div class="pic">${img}</div>
     ${p.is_discount?'<div class="badge">🏷️ Chegirma</div>':''}
     ${p.is_new?'<div class="badge">🆕 Yangi</div>':''}
     <div class="name">${esc(p.name)}</div>
     ${p.old_price?`<div class="old">${money(p.old_price)}</div>`:''}
     <div class="price">${money(p.price)}</div>
     <button class="add" onclick="add(${Number(p.id)})">🛒 Savatga qo‘shish</button>
   </div>`
 }).join('');
 updateCount();
}

function add(id){cart[id]=(cart[id]||0)+1;render()}
function updateCount(){document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function items(){return products.filter(p=>cart[p.id])}
function total(){return items().reduce((s,p)=>s+Number(p.price)*cart[p.id],0)}

function openCart(){
 if(!items().length){alert('Savat bo‘sh.');return}
 document.getElementById('cartList').innerHTML=items().map(p=>`
  <div class="row">
   <div class="rowinfo"><div class="rowname">${esc(p.name)}</div><div class="rowprice">${cart[p.id]} × ${money(p.price)}</div></div>
   <div class="q">
    <button onclick="chg(${p.id},-1)">−</button>
    <b>${cart[p.id]}</b>
    <button onclick="chg(${p.id},1)">+</button>
   </div>
  </div>`).join('');
 document.getElementById('cartTotal').textContent='Jami: '+money(total());
 document.getElementById('cartModal').classList.add('show');
}
function chg(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];render();openCart()}
function openCheckout(){
 if(!items().length){alert('Savat bo‘sh.');return}
 closeModal('cartModal');
 document.getElementById('checkoutTotal').textContent='Jami: '+money(total());
 document.getElementById('checkoutModal').classList.add('show');
}
function closeModal(id){document.getElementById(id).classList.remove('show')}

function getLocation(){
 const b=document.getElementById('locBtn'),s=document.getElementById('locStatus'),m=document.getElementById('map');
 if(!navigator.geolocation){s.textContent='❌ Brauzer lokatsiyani qo‘llamaydi';return}
 b.disabled=true;b.textContent='⏳ Aniqlanmoqda...';s.textContent='📍 Aniqlanmoqda...';
 navigator.geolocation.getCurrentPosition(pos=>{
   lat=pos.coords.latitude;lon=pos.coords.longitude;
   s.textContent='📍 Lokatsiya olindi';
   b.disabled=false;b.textContent='📍 Lokatsiyamni aniqlash';
   m.href=`https://maps.google.com/?q=${lat},${lon}`;m.style.display='block';
 },err=>{
   b.disabled=false;b.textContent='📍 Lokatsiyamni aniqlash';
   s.textContent=err.code===1?'❌ Lokatsiyaga ruxsat berilmadi':'❌ Lokatsiyani aniqlab bo‘lmadi';
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

async function sendOrder(){
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const address=document.getElementById('address').value.trim();
 const payment=document.getElementById('payment').value;
 const its=items();
 if(!name){alert('Ismingizni kiriting.');return}
 if(!phone){alert('Telefon raqamingizni kiriting.');return}
 if(!its.length){alert('Savat bo‘sh.');return}
 if(lat===null||lon===null){alert('📍 Avval lokatsiyangizni aniqlang.');return}

 const btn=document.getElementById('sendBtn');
 btn.disabled=true;btn.textContent='⏳ Yuborilmoqda...';

 const payload={
   name,phone,address,latitude:lat,longitude:lon,payment_method:payment,
   items:its.map(p=>({
     id:Number(p.id),
     name:p.name,
     price:Number(p.price),
     quantity:Number(cart[p.id]),
     total:Number(p.price)*Number(cart[p.id])
   })),
   total:Number(total())
 };

 try{
   const r=await fetch('/api/order',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify(payload)
   });
   const d=await r.json().catch(()=>({}));
   if(!r.ok||d.ok===false)throw new Error(d.error||'Buyurtma yuborilmadi');
   closeModal('checkoutModal');
   document.getElementById('doneModal').classList.add('show');
 }catch(e){
   alert('❌ Xatolik: '+e.message);
 }finally{
   btn.disabled=false;btn.textContent='✅ Buyurtmani tasdiqlash';
 }
}

function finish(){
 closeModal('doneModal');
 cart={};lat=null;lon=null;
 document.getElementById('locStatus').textContent='📍 Lokatsiya olinmagan';
 document.getElementById('map').style.display='none';
 render();
}

loadProducts();
</script>
</body>
</html>
