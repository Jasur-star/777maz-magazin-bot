<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>777MAZ Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{position:sticky;top:0;z-index:5;background:#fff;padding:14px;border-bottom:1px solid #ddd}
h1{margin:0 0 10px;font-size:22px}
button{border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
.top{display:flex;gap:8px;flex-wrap:wrap}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin-bottom:10px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 5px #ddd}
.pic{height:150px;border-radius:10px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden;margin-bottom:8px}
.pic img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;min-height:40px}
.price{font-weight:700;margin:7px 0}
.old{text-decoration:line-through;color:#999;font-size:13px}
.tag{font-size:12px;margin-bottom:5px}
.qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty button{padding:7px 11px;background:#111;color:#fff}
.cart{position:fixed;right:14px;bottom:14px;border-radius:30px;padding:14px 18px;background:#111;color:#fff;z-index:10}
.empty{text-align:center;padding:30px;color:#777}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:650px;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.close{background:#eee}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 10px;font-size:15px}
textarea{min-height:75px;resize:vertical}
.cartrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.cartinfo{flex:1}
.qbtn{padding:6px 10px;background:#eee}
.total{font-size:19px;font-weight:800;margin:15px 0}
.primary{width:100%;background:#111;color:#fff;margin-top:8px}
.location{width:100%;background:#e9f3ff;color:#0759a5;margin-bottom:8px}
.location.ok{background:#e8f7e8;color:#14752a}
.maplink{display:block;margin:4px 0 12px;color:#0759a5;text-decoration:none}
.notice{padding:10px;background:#f7f7f7;border-radius:10px;font-size:13px;margin-bottom:10px}
.success{font-size:18px;text-align:center;padding:20px 5px}
@media(max-width:480px){
 .products{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pic{height:125px}
}
</style>
</head>
<body>

<header>
  <h1>🛍 777MAZ Market</h1>
  <input id="search" class="search" placeholder="🔎 Mahsulot qidirish..." oninput="render()">
  <div class="top">
    <button onclick="setCategory('')">Barchasi</button>
    <button onclick="setCategory('🥤 Ichimliklar')">🥤 Ichimliklar</button>
    <button onclick="setCategory('🍫 Shirinliklar')">🍫 Shirinliklar</button>
    <button onclick="setCategory('🍎 Mevalar')">🍎 Mevalar</button>
    <button onclick="setCategory('🥕 Sabzavotlar')">🥕 Sabzavotlar</button>
    <button onclick="setCategory('👶 Bolalar ovqati')">👶 Bolalar</button>
    <button onclick="setCategory('🍳 Oshxona mahsulotlari')">🍳 Oshxona</button>
    <button onclick="setCategory('🧴 Gellar va shampunlar')">🧴 Gellar</button>
  </div>
</header>

<div id="products" class="products"></div>
<button class="cart" onclick="showCart()">🛒 Savat (<span id="cartCount">0</span>)</button>

<div id="cartModal" class="modal">
  <div class="sheet">
    <div class="modalhead">
      <h2>🛒 Savat</h2>
      <button class="close" onclick="closeModal('cartModal')">✕</button>
    </div>
    <div id="cartItems"></div>
    <div id="cartTotal" class="total"></div>
    <button class="primary" onclick="openCheckout()">➡️ Buyurtma berish</button>
  </div>
</div>

<div id="checkoutModal" class="modal">
  <div class="sheet">
    <div class="modalhead">
      <h2>📋 Buyurtma</h2>
      <button class="close" onclick="closeModal('checkoutModal')">✕</button>
    </div>

    <div class="notice">
      Ism, telefon, manzil va lokatsiyangizni kiriting. Buyurtma yuborilganda ma'lumotlar admin Telegram'iga boradi.
    </div>

    <label>👤 Ismingiz</label>
    <input id="name" placeholder="Ismingiz">

    <label>📞 Telefon</label>
    <input id="phone" type="tel" placeholder="+998 90 123 45 67">

    <label>📍 Manzil</label>
    <textarea id="address" placeholder="Ko'cha, uy, xonadon..."></textarea>

    <button id="locationBtn" class="location" onclick="getLocation()">📍 Lokatsiyamni yuborish</button>
    <div id="locationStatus"></div>
    <a id="mapLink" class="maplink" target="_blank" style="display:none">🗺 Xaritada ko‘rish</a>

    <label>💳 To‘lov usuli</label>
    <select id="payment">
      <option value="Naqd pul">💵 Naqd pul</option>
      <option value="Karta orqali">💳 Karta orqali</option>
      <option value="Joyida to‘lov">🏪 Joyida to‘lov</option>
    </select>

    <div id="checkoutTotal" class="total"></div>
    <button class="primary" onclick="sendOrder()">✅ Buyurtmani yuborish</button>
  </div>
</div>

<div id="successModal" class="modal">
  <div class="sheet">
    <div class="success">
      <div style="font-size:55px">✅</div>
      <h2>Buyurtma qabul qilindi!</h2>
      <p>Tez orada siz bilan bog‘lanamiz.</p>
      <button class="primary" onclick="closeAll()">🏠 Marketga qaytish</button>
    </div>
  </div>
</div>

<script>
let products=[];
let category='';
let cart={};
let latitude=null;
let longitude=null;

const icons={
  '🥤 Ichimliklar':'🥤',
  '🍫 Shirinliklar':'🍫',
  '🍎 Mevalar':'🍎',
  '🥕 Sabzavotlar':'🥕',
  '👶 Bolalar ovqati':'👶',
  '🍳 Oshxona mahsulotlari':'🍳',
  '🧴 Gellar va shampunlar':'🧴'
};

async function load(){
  try{
    const r=await fetch('/api/products');
    const d=await r.json();
    products=d.products||[];
    render();
  }catch(e){
    document.getElementById('products').innerHTML='<div class="empty">Mahsulotlarni yuklashda xatolik.</div>';
  }
}

function setCategory(c){
  category=c;
  render();
}

function money(n){
  return Number(n||0).toLocaleString('uz-UZ')+' so‘m';
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function render(){
  const q=(document.getElementById('search')?.value||'').trim().toLowerCase();

  const list=products.filter(p=>{
    const catOk=!category || p.category===category;
    const searchOk=!q || String(p.name||'').toLowerCase().includes(q);
    return catOk && searchOk;
  });

  const el=document.getElementById('products');

  if(!list.length){
    el.innerHTML='<div class="empty">Mahsulot topilmadi.</div>';
    updateCartCount();
    return;
  }

  el.innerHTML=list.map(p=>{
    const image=p.image_file_id
      ? `<img src="/api/product-image?file_id=${encodeURIComponent(p.image_file_id)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentElement.innerHTML='${icons[p.category]||'🛍️'}'">`
      : (icons[p.category]||'🛍️');

    const tag=p.is_discount
      ? '<div class="tag">🏷️ Chegirma</div>'
      : (p.is_new ? '<div class="tag">🆕 Yangi</div>' : '');

    return `<div class="card">
      <div class="pic">${image}</div>
      ${tag}
      <div class="name">${esc(p.name)}</div>
      ${p.old_price ? `<div class="old">${money(p.old_price)}</div>` : ''}
      <div class="price">${money(p.price)}</div>
      <div class="qty">
        <button onclick="add(${p.id})">🛒 Qo‘shish</button>
        <span>${cart[p.id]||0}</span>
      </div>
    </div>`;
  }).join('');

  updateCartCount();
}

function add(id){
  cart[id]=(cart[id]||0)+1;
  render();
}

function changeQty(id,delta){
  cart[id]=(cart[id]||0)+delta;
  if(cart[id]<=0) delete cart[id];
  render();
  showCart();
}

function updateCartCount(){
  document.getElementById('cartCount').textContent=
    Object.values(cart).reduce((a,b)=>a+b,0);
}

function getCartItems(){
  return products.filter(p=>cart[p.id]);
}

function getTotal(){
  return getCartItems().reduce((sum,p)=>sum+Number(p.price)*cart[p.id],0);
}

function showCart(){
  const items=getCartItems();
  if(!items.length){
    alert('Savat bo‘sh.');
    return;
  }

  const el=document.getElementById('cartItems');
  el.innerHTML=items.map(p=>`
    <div class="cartrow">
      <div class="cartinfo">
        <b>${esc(p.name)}</b><br>
        ${money(p.price)} × ${cart[p.id]}
      </div>
      <button class="qbtn" onclick="changeQty(${p.id},-1)">−</button>
      <b>${cart[p.id]}</b>
      <button class="qbtn" onclick="changeQty(${p.id},1)">+</button>
    </div>
  `).join('');

  document.getElementById('cartTotal').textContent='Jami: '+money(getTotal());
  document.getElementById('cartModal').classList.add('show');
}

function openCheckout(){
  if(!getCartItems().length){
    alert('Savat bo‘sh.');
    return;
  }
  closeModal('cartModal');
  document.getElementById('checkoutTotal').textContent='Jami: '+money(getTotal());
  document.getElementById('checkoutModal').classList.add('show');
}

function closeModal(id){
  document.getElementById(id).classList.remove('show');
}

function closeAll(){
  document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'));
  cart={};
  latitude=null;
  longitude=null;
  render();
}

function getLocation(){
  const btn=document.getElementById('locationBtn');
  const status=document.getElementById('locationStatus');

  if(!navigator.geolocation){
    status.innerHTML='<div class="notice">❌ Bu brauzer lokatsiyani qo‘llab-quvvatlamaydi.</div>';
    return;
  }

  btn.disabled=true;
  btn.textContent='⏳ Lokatsiya olinmoqda...';

  navigator.geolocation.getCurrentPosition(
    pos=>{
      latitude=pos.coords.latitude;
      longitude=pos.coords.longitude;

      btn.disabled=false;
      btn.classList.add('ok');
      btn.textContent='✅ Lokatsiya olindi';

      status.innerHTML='<div class="notice">📍 Lokatsiyangiz aniqlandi.</div>';

      const link=document.getElementById('mapLink');
      link.href=`https://maps.google.com/?q=${latitude},${longitude}`;
      link.style.display='block';
    },
    err=>{
      btn.disabled=false;
      btn.textContent='📍 Lokatsiyamni yuborish';

      let msg='Lokatsiyani olish imkoni bo‘lmadi.';
      if(err.code===1) msg='❌ Lokatsiyaga ruxsat berilmadi. Brauzerda Location/GPS ruxsatini yoqing.';
      if(err.code===2) msg='❌ Lokatsiya aniqlanmadi.';
      if(err.code===3) msg='❌ Lokatsiya olish vaqti tugadi.';
      status.innerHTML='<div class="notice">'+msg+'</div>';
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

async function sendOrder(){
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const address=document.getElementById('address').value.trim();
  const payment=document.getElementById('payment').value;
  const items=getCartItems();

  if(!name){
    alert('Ismingizni yozing.');
    return;
  }
  if(!phone){
    alert('Telefon raqamingizni yozing.');
    return;
  }
  if(!items.length){
    alert('Savat bo‘sh.');
    return;
  }
  if(latitude===null || longitude===null){
    alert('Avval 📍 Lokatsiyamni yuborish tugmasini bosing.');
    return;
  }

  const btn=document.querySelector('#checkoutModal .primary');
  btn.disabled=true;
  btn.textContent='⏳ Yuborilmoqda...';

  const payload={
    name,
    phone,
    address,
    latitude,
    longitude,
    payment_method:payment,
    items:items.map(p=>({
      id:p.id,
      quantity:cart[p.id]
    }))
  };

  try{
    const r=await fetch('/api/order',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    const d=await r.json();

    if(!r.ok || !d.ok){
      throw new Error(d.error||'Buyurtma yuborilmadi.');
    }

    closeModal('checkoutModal');
    document.getElementById('successModal').classList.add('show');

  }catch(e){
    alert('❌ Xatolik: '+e.message);
  }finally{
    btn.disabled=false;
    btn.textContent='✅ Buyurtmani yuborish';
  }
}

load();
</script>
</body>
</html>
