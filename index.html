<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>777MAZ Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#202124}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:auto}
.logo{font-size:22px;font-weight:800}
.cart-btn{background:#111;color:#fff;border-radius:12px;padding:10px 14px}
.categories{max-width:1100px;margin:10px auto 0;display:flex;gap:7px;overflow:auto;padding-bottom:3px}
.categories button{white-space:nowrap;background:#f0f2f5;border-radius:10px;padding:9px 12px}
.categories button.active{background:#111;color:#fff}
.wrap{max-width:1100px;margin:auto;padding:12px}
.hero{background:linear-gradient(135deg,#fff,#eef3f7);border-radius:18px;padding:18px;margin-bottom:12px}
.hero h2{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:#667085}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 10px #00000010}
.pic{height:190px;border-radius:12px;background:#f1f3f5;display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.tag{margin-top:8px;font-size:12px;font-weight:700}
.name{font-weight:700;min-height:40px;margin-top:5px}
.old{text-decoration:line-through;color:#999;font-size:13px;margin-top:5px}
.price{font-size:18px;font-weight:800;margin:6px 0}
.add{width:100%;background:#111;color:#fff;border-radius:10px;padding:10px}
.empty{text-align:center;padding:40px;color:#777}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{background:#eee;border-radius:10px;padding:7px 11px}
.cart-line{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.cart-info{flex:1}.cart-name{font-weight:700}.cart-price{font-size:13px;color:#667085}
.qty{display:flex;align-items:center;gap:7px}.qty button{background:#eee;border-radius:8px;padding:6px 9px;font-size:13px;white-space:nowrap}
.total{font-size:20px;font-weight:800;text-align:right;margin:15px 0}
.form label{display:block;font-weight:700;margin:10px 0 5px}
.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;outline:none}
.location{display:flex;gap:8px;margin-top:8px}
.location button{flex:1;background:#eef2f6;border-radius:10px;padding:10px}
.payments{display:grid;gap:8px}.pay{border:1px solid #d0d5dd;border-radius:10px;padding:11px;text-align:left;background:#fff}.pay.selected{border:2px solid #111}
.submit{width:100%;background:#111;color:#fff;border-radius:12px;padding:13px;margin-top:14px;font-weight:700}
.info{background:#f6f7f9;border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:100}
.toast.show{display:block}
@media(max-width:800px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.pic{height:155px}}
@media(max-width:430px){.products{gap:8px}.card{padding:8px}.pic{height:130px}.name{font-size:14px}.price{font-size:16px}}
</style>
</head>
<body>

<header class="header">
  <div class="header-row">
    <div class="logo">🛍️ 777MAZ Market</div>
    <button class="cart-btn" onclick="openCart()">🛒 Savat (<span id="cartCount">0</span>)</button>
  </div>
  <div class="categories" id="categories"></div>
</header>

<main class="wrap">
  <section class="hero">
    <h2>777MAZ Market</h2>
    <p>Kerakli mahsulotlarni tanlang va uyga buyurtma bering.</p>
  </section>
  <div id="products" class="products"></div>
</main>

<div id="cartModal" class="modal-bg" onclick="outsideClose(event,'cartModal')">
  <div class="modal">
    <div class="modal-head"><h2>🛒 Savat</h2><button class="close" onclick="closeModal('cartModal')">✕</button></div>
    <div id="cartItems"></div>
    <div id="cartTotal" class="total"></div>
    <button class="submit" onclick="openOrder()">📝 Buyurtma berish</button>
  </div>
</div>

<div id="orderModal" class="modal-bg" onclick="outsideClose(event,'orderModal')">
  <div class="modal">
    <div class="modal-head"><h2>📝 Buyurtma</h2><button class="close" onclick="closeModal('orderModal')">✕</button></div>
    <div class="form">
      <label>👤 Ismingiz</label>
      <input id="name" placeholder="Ismingizni yozing">

      <label>📞 Telefon raqamingiz</label>
      <input id="phone" type="tel" placeholder="+998 90 123 45 67">

      <label>📍 Manzil</label>
      <textarea id="address" rows="3" placeholder="Ko‘cha, uy, xonadon"></textarea>

      <div class="location">
        <button type="button" onclick="getLocation()">📍 Lokatsiyani yuborish</button>
        <button type="button" onclick="useShopAddress()">🏪 Do‘kon manzilidan foydalanish</button>
      </div>
      <div id="gpsInfo" class="info">📍 GPS lokatsiya hali olinmagan.</div>

      <label>💳 To‘lov usuli</label>
      <div class="payments">
        <button class="pay" data-pay="Karta orqali" onclick="choosePay(this)">💳 Karta orqali</button>
        <button class="pay" data-pay="Naqd pul" onclick="choosePay(this)">💵 Naqd pul</button>
        <button class="pay" data-pay="Joyida to‘lov" onclick="choosePay(this)">🏪 Joyida to‘lov</button>
      </div>

      <div id="orderSummary" class="info"></div>
      <button id="submitBtn" class="submit" onclick="sendOrder()">✅ Buyurtmani tasdiqlash</button>
    </div>
  </div>
</div>

<div id="successModal" class="modal-bg">
  <div class="modal">
    <div class="modal-head"><h2>✅ Buyurtma qabul qilindi</h2></div>
    <div id="successText" class="info"></div>
    <button class="submit" onclick="closeModal('successModal')">🏠 Davom etish</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let products=[];
let category='';
let cart=JSON.parse(localStorage.getItem('777maz_cart')||'{}');
let latitude=null, longitude=null;
let paymentMethod='';

const icons={
  '🥤 Ichimliklar':'🥤','🍫 Shirinliklar':'🍫','🍎 Mevalar':'🍎',
  '🥕 Sabzavotlar':'🥕','🫘 Dukkakli mahsulotlar':'🫘','👶 Bolalar ovqati':'👶',
  '🍳 Oshxona mahsulotlari':'🍳','🧴 Gellar va shampunlar':'🧴'
};

function esc(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function money(n){return Number(n||0).toLocaleString('uz-UZ')+' so‘m'}

const WEIGHT_CATEGORIES=new Set(['🍎 Mevalar','🥕 Sabzavotlar','🫘 Dukkakli mahsulotlar']);
function isWeightProduct(p){return WEIGHT_CATEGORIES.has(p.category)}
function weightPrice(price,grams){return Math.floor(Number(price||0)*Number(grams||0)/1000)}
function weightLabel(grams){
  grams=Number(grams||0);
  if(grams>=1000 && grams%1000===0) return (grams/1000)+' kg';
  return grams+' g';
}
function normalizeWeightCart(){
  products.forEach(p=>{
    if(isWeightProduct(p) && cart[p.id]!=null){
      const q=Number(cart[p.id]);
      if(q>0 && q<100) cart[p.id]=q*100;
      else if(q>=100) cart[p.id]=Math.floor(q/100)*100;
    }
  });
  saveCart();
}

async function load(){
  try{
    const r=await fetch('/api/products',{cache:'no-store'});
    const d=await r.json();
    products=d.products||[];
    normalizeWeightCart();
    renderCategories();
    render();
  }catch(e){
    document.getElementById('products').innerHTML='<div class="empty">Mahsulotlarni yuklashda xatolik.</div>';
  }
}

function renderCategories(){
  const cats=['','🥤 Ichimliklar','🍫 Shirinliklar','🍎 Mevalar','🥕 Sabzavotlar','🫘 Dukkakli mahsulotlar','👶 Bolalar ovqati','🍳 Oshxona mahsulotlari','🧴 Gellar va shampunlar'];
  document.getElementById('categories').innerHTML=cats.map(c=>
    `<button class="${category===c?'active':''}" onclick="setCategory('${c}')">${c||'🛍 Barchasi'}</button>`
  ).join('');
}
function setCategory(c){category=c;renderCategories();render()}

function render(){
  const list=products.filter(p=>!category||p.category===category);
  const el=document.getElementById('products');
  if(!list.length){el.innerHTML='<div class="empty">Mahsulot topilmadi.</div>';return}
  el.innerHTML=list.map(p=>{
    const image=p.image_file_id
      ? `<img src="/api/product-image?file_id=${encodeURIComponent(p.image_file_id)}" alt="${esc(p.name)}" loading="lazy">`
      : (icons[p.category]||'🛍️');
    const tag=p.is_discount?'🏷️ Chegirma':(p.is_new?'🆕 Yangi':'');
    return `<div class="card">
      <div class="pic">${image}</div>
      ${tag?`<div class="tag">${tag}</div>`:''}
      <div class="name">${esc(p.name)}</div>
      ${p.old_price?`<div class="old">${money(p.old_price)}${isWeightProduct(p)?' / kg':''}</div>`:''}
      <div class="price">${money(p.price)}${isWeightProduct(p)?' / kg':''}</div>
      <button class="add" onclick="add(${p.id})">${isWeightProduct(p)?'⚖️ 100 g ni savatga qo‘shish':'🛒 Savatga qo‘shish'}</button>
    </div>`;
  }).join('');
  updateCount();
}

function add(id){
  const p=products.find(x=>Number(x.id)===Number(id));
  if(!p)return;
  const step=isWeightProduct(p)?100:1;
  cart[id]=(cart[id]||0)+step;
  saveCart(); updateCount(); toast(isWeightProduct(p)?'✅ 100 g savatga qo‘shildi':'✅ Mahsulot savatga qo‘shildi');
}
function changeQty(id,delta){
  const p=products.find(x=>Number(x.id)===Number(id));
  if(!p)return;
  const step=isWeightProduct(p)?100:1;
  cart[id]=(cart[id]||0)+delta;
  if(isWeightProduct(p)) cart[id]=Math.floor(cart[id]/100)*100;
  if(cart[id]<=0)delete cart[id];
  saveCart(); openCart();
}
function saveCart(){localStorage.setItem('777maz_cart',JSON.stringify(cart))}
function updateCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+Number(b),0)}

function openCart(){
  const items=products.filter(p=>cart[p.id]);
  const box=document.getElementById('cartItems');
  if(!items.length){
    box.innerHTML='<div class="empty">🛒 Savat bo‘sh.</div>';
    document.getElementById('cartTotal').textContent='';
    document.querySelector('#cartModal .submit').style.display='none';
  }else{
    document.querySelector('#cartModal .submit').style.display='block';
    let total=0;
    box.innerHTML=items.map(p=>{
      const q=Number(cart[p.id]);
      const weighted=isWeightProduct(p);
      const lineTotal=weighted?weightPrice(p.price,q):Number(p.price)*q;
      total+=lineTotal;
      const unitText=weighted?`${money(p.price)} / kg`:`${money(p.price)} × ${q}`;
      const qtyText=weighted?weightLabel(q):q;
      const minus=weighted?'− 100 g':'−';
      const plus=weighted?'+ 100 g':'+';
      return `<div class="cart-line">
        <div class="cart-info"><div class="cart-name">${esc(p.name)}</div><div class="cart-price">${unitText} · <b>${qtyText}</b> · ${money(lineTotal)}</div></div>
        <div class="qty">
          <button onclick="changeQty(${p.id},-${weighted?100:1})">${minus}</button><b>${qtyText}</b><button onclick="changeQty(${p.id},${weighted?100:1})">${plus}</button>
        </div>
      </div>`;
    }).join('');
    document.getElementById('cartTotal').textContent='Jami: '+money(total);
  }
  document.getElementById('cartModal').classList.add('show');
}

function openOrder(){
  if(!products.some(p=>cart[p.id])){toast('🛒 Savat bo‘sh');return}
  closeModal('cartModal');
  document.getElementById('orderModal').classList.add('show');
  updateOrderSummary();
}
function updateOrderSummary(){
  let total=0, lines=[];
  products.filter(p=>cart[p.id]).forEach(p=>{
    const q=Number(cart[p.id]);
    const line=isWeightProduct(p)?weightPrice(p.price,q):Number(p.price)*q;
    total+=line;
    lines.push(`${esc(p.name)} — ${isWeightProduct(p)?weightLabel(q):q+' dona'} — ${money(line)}`);
  });
  document.getElementById('orderSummary').innerHTML=`🛍 <b>Buyurtma:</b><br>${lines.join('<br>')}<br><br>💰 Jami: <b>${money(total)}</b>`;
}
function choosePay(btn){
  document.querySelectorAll('.pay').forEach(x=>x.classList.remove('selected'));
  btn.classList.add('selected'); paymentMethod=btn.dataset.pay;
}
function getLocation(){
  if(!navigator.geolocation){toast('❌ Brauzer lokatsiyani qo‘llamaydi');return}
  navigator.geolocation.getCurrentPosition(pos=>{
    latitude=pos.coords.latitude; longitude=pos.coords.longitude;
    document.getElementById('gpsInfo').textContent=`✅ GPS olindi: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
  },()=>toast('❌ Lokatsiyaga ruxsat berilmadi'),{enableHighAccuracy:true,timeout:10000});
}
async function useShopAddress(){
  try{
    const r=await fetch('/api/settings',{cache:'no-store'}); const d=await r.json();
    document.getElementById('address').value=d.address||'';
  }catch(e){}
}
async function sendOrder(){
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const address=document.getElementById('address').value.trim();
  const items=products.filter(p=>cart[p.id]).map(p=>isWeightProduct(p)?({id:p.id,grams:Number(cart[p.id])}):({id:p.id,quantity:Number(cart[p.id])}));
  if(!name){toast('❗ Ismni kiriting');return}
  if(!phone){toast('❗ Telefon raqamini kiriting');return}
  if(!address){toast('❗ Manzilni kiriting');return}
  if(!items.length){toast('❗ Savat bo‘sh');return}
  if(!paymentMethod){toast('❗ To‘lov usulini tanlang');return}

  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='⏳ Yuborilmoqda...';
  try{
    const r=await fetch('/api/order',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,phone,address,latitude,longitude,payment_method:paymentMethod,items})
    });
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||'Server xatosi');
    cart={};saveCart();updateCount();
    closeModal('orderModal');
    document.getElementById('successText').innerHTML=`🎉 Buyurtmangiz qabul qilindi.<br><br><b>Buyurtma №${d.order_id}</b><br>💰 ${money(d.total)}<br>💳 ${esc(paymentMethod)}`;
    document.getElementById('successModal').classList.add('show');
  }catch(e){toast('❌ '+e.message)}
  finally{btn.disabled=false;btn.textContent='✅ Buyurtmani tasdiqlash'}
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function outsideClose(e,id){if(e.target.id===id)closeModal(id)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

updateCount();
load();
</script>
</body>
</html>
