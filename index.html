<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>777MAZ Market</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
header{position:sticky;top:0;z-index:5;background:#fff;padding:16px;border-bottom:1px solid #eee}
.logo{font-size:26px;font-weight:900}.sub{color:#777;font-size:13px;margin-top:3px}
.search{margin-top:12px;width:100%;padding:13px 15px;border:0;border-radius:14px;background:#f0f1f3;font-size:16px}
.container{max-width:1000px;margin:auto;padding:16px}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cat{background:#fff;border:1px solid #eee;border-radius:14px;padding:12px 5px;text-align:center;cursor:pointer;font-size:12px}
.cat b{display:block;font-size:24px;margin-bottom:5px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:17px;padding:10px;box-shadow:0 2px 12px #0000000d}
.pic{height:170px;border-radius:13px;background:#f0f1f3;display:flex;align-items:center;justify-content:center;font-size:58px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}.name{font-weight:750;margin-top:9px}.price{font-weight:900;margin-top:6px}
.old{text-decoration:line-through;color:#888;font-size:13px}.tag{font-size:12px;margin-top:5px}
.add{width:100%;margin-top:9px;background:#111;color:#fff;font-weight:700;padding:12px;border:0;border-radius:12px}
.cart{position:fixed;right:16px;bottom:18px;background:#111;color:#fff;border:0;border-radius:25px;padding:14px 18px;font-weight:800}
.panel{position:fixed;inset:0;background:#0008;display:none;z-index:20}.box{background:#fff;position:absolute;bottom:0;left:0;right:0;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 10px;font-size:16px}
.primary{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;margin-top:5px}
.secondary{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;margin-top:7px}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.loc{background:#f0f7ff;padding:11px;border-radius:12px;margin:8px 0}
@media(max-width:520px){.categories{grid-template-columns:repeat(3,1fr)}.pic{height:145px}}
</style>
</head>
<body>
<header>
<div class="logo">777MAZ Market</div><div class="sub">Sifatli mahsulotlar — qulay xarid</div>
<input id="search" class="search" placeholder="🔎 Mahsulot izlash..." oninput="render()">
</header>
<main class="container">
<h3>Kategoriyalar</h3><div id="cats" class="categories"></div>
<h3>Mahsulotlar</h3><div id="products" class="products"></div>
</main>

<button class="cart" onclick="openCart()">🛒 Savat <span id="count">0</span></button>

<div id="panel" class="panel" onclick="if(event.target.id==='panel')closePanel()">
<div class="box">
<h2>🛒 Savat va buyurtma</h2><div id="cartRows"></div>
<div id="checkout" style="display:none">
<hr><h3>📦 Yetkazib berish</h3>
<input id="name" placeholder="Ismingiz">
<input id="phone" placeholder="Telefon raqam">
<textarea id="address" placeholder="Ko‘cha, uy, xonadon"></textarea>
<div class="loc">📍 <b id="locText">Lokatsiya olinmagan</b></div>
<button class="primary" onclick="getLocation()">📍 Lokatsiyamni aniqlash</button>
<select id="payment"><option>💵 Naqd pul</option><option>💳 Karta orqali</option><option>🏪 Joyida to‘lov</option></select>
<button class="primary" onclick="sendOrder()">✅ Buyurtmani tasdiqlash</button>
</div>
<button class="secondary" onclick="closePanel()">Yopish</button>
</div></div>

<script>
let products=[], category='', cart={}, lat=null, lon=null;
const icons={'🥤 Ichimliklar':'🥤','🍫 Shirinliklar':'🍫','🍎 Mevalar':'🍎','🥕 Sabzavotlar':'🥕','👶 Bolalar ovqati':'👶','🍳 Oshxona mahsulotlari':'🍳','🧴 Gellar va shampunlar':'🧴'};

async function load(){
 const r=await fetch('/api/products'); const d=await r.json(); products=d.products||[];
 const s=await fetch('/api/settings'); const st=await s.json();
 document.getElementById('cats').innerHTML='<div class="cat" onclick="setCat(\'\')"><b>🛍️</b>Barchasi</div>'+
 Object.keys(icons).map(c=>`<div class="cat" onclick="setCat('${c.replaceAll("'","\\'")}')"><b>${icons[c]}</b>${c.replace(/^.. /,'')}</div>`).join('');
 render();
}
function setCat(c){category=c;render()}
function money(n){return Number(n).toLocaleString('uz-UZ')+' so‘m'}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const list=products.filter(p=>(!category||p.category===category)&&p.name.toLowerCase().includes(q));
 document.getElementById('products').innerHTML=list.map(p=>{
   const image=p.image_file_id?'':'';
   const tag=p.is_discount?`<div class="tag">🏷️ Chegirma</div>`:(p.is_new?`<div class="tag">🆕 Yangi</div>`:'');
   return `<div class="card"><div class="pic">${icons[p.category]||'🛍️'}</div>
   <div class="name">${esc(p.name)}</div>${p.is_discount&&p.old_price?`<div class="old">${money(p.old_price)}</div>`:''}
   <div class="price">${money(p.price)}</div>${tag}<button class="add" onclick="add(${p.id})">🛒 Savatga</button></div>`;
 }).join('')||'<p>Mahsulot topilmadi.</p>';
 updateCount();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function add(id){cart[id]=(cart[id]||0)+1;updateCount()}
function updateCount(){document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function openCart(){
 document.getElementById('panel').style.display='block';
 document.getElementById('checkout').style.display='none';
 drawCart();
}
function drawCart(){
 const ids=Object.keys(cart); let total=0;
 document.getElementById('cartRows').innerHTML=ids.length?ids.map(id=>{
   const p=products.find(x=>x.id==id), q=cart[id]; total+=p.price*q;
   return `<div class="item"><span>${esc(p.name)}<br>${q} × ${money(p.price)}</span><b>${money(p.price*q)}<br>
   <button onclick="cart[${id}]=Math.max(0,(cart[${id}]||0)-1);if(!cart[${id}])delete cart[${id}];drawCart();updateCount()">−</button>
   <button onclick="add(${id});drawCart()">+</button></b></div>`;
 }).join('')+`<h3>Jami: ${money(total)}</h3><button class="primary" onclick="showCheckout()">📝 Buyurtma berish</button>`:'<p>Savat hozircha bo‘sh.</p>';
}
function showCheckout(){document.getElementById('checkout').style.display='block'}
function closePanel(){document.getElementById('panel').style.display='none'}
function getLocation(){
 if(!navigator.geolocation){alert('Telefon GPS lokatsiyasini qo‘llamaydi.');return}
 document.getElementById('locText').textContent='Aniqlanmoqda...';
 navigator.geolocation.getCurrentPosition(pos=>{
   lat=pos.coords.latitude;lon=pos.coords.longitude;
   document.getElementById('locText').textContent=`${lat.toFixed(6)}, ${lon.toFixed(6)}`;
   document.getElementById('address').value=document.getElementById('address').value||`https://maps.google.com/?q=${lat},${lon}`;
 },err=>{document.getElementById('locText').textContent='Lokatsiyaga ruxsat berilmadi';alert('Brauzerda lokatsiyaga ruxsat bering.');},{enableHighAccuracy:true,timeout:10000});
}
async function sendOrder(){
 const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();
 if(!name||!phone){alert('Ism va telefonni kiriting.');return}
 if(!Object.keys(cart).length){alert('Savat bo‘sh.');return}
 const items=Object.entries(cart).map(([id,quantity])=>({id:Number(id),quantity}));
 const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   name,phone,address,latitude:lat,longitude:lon,payment_method:document.getElementById('payment').value,items
 })});
 const d=await r.json();
 if(!d.ok){alert(d.error||'Xatolik');return}
 cart={};lat=null;lon=null;updateCount();closePanel();
 alert(`✅ Buyurtma №${d.order_id} qabul qilindi!\\n💰 ${money(d.total)}\\nTez orada siz bilan bog‘lanamiz.`);
}
load();
</script>
</body></html>
